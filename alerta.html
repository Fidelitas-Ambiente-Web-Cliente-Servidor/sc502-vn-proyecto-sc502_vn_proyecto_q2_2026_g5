<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/alerta.css">
</head>

<body>

    <aside class="sidebar">

        <h2><i class="fa-solid fa-paw"></i> Huellas</h2>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>
            </li>

            <li>
                <a href="adopcion.html">
                    <i class="fa-solid fa-heart"></i>
                    Adopción

            </li>

            <li>
                <a class="activo"  href="alerta.html">
                    <i class="fa-solid fa-location-dot"></i>
                    Reportes
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="educacion.html">
                    <i class="fa-solid fa-book"></i>
                    Educación
                </a>
            </li>

        </ul>

    </aside>

    <header>
        <div class="back">
            <div class="menu">
                <h1>Huellas a Casa</h1>

            </div>

            <p>
                Reporta animales perdidos o encontrados y consulta las alertas
                publicadas por otros usuarios.
            </p>
        </div>
    </header>

    <main>

        <fieldset>

            <legend>Crear Reporte</legend>

            <form id="formulario">

                <div>
                    <label for="tipo">Tipo de reporte</label><br>
                    <select id="tipo">
                        <option value="">Seleccione</option>
                        <option>Animal Perdido</option>
                        <option>Animal Encontrado</option>
                    </select>
                    <span id="errorTipo"></span>
                </div>


                <br>

                <div>
                    <label for="animal">Nombre del animal</label><br>
                    <input type="text" id="animal">
                    <span id="errorAnimal"></span>
                </div>

                <br>

                <div>
                    <label for="ubicacion">Ubicación</label><br>
                    <input type="text" id="ubicacion">
                    <span id="errorUbicacion"></span>
                </div>

                <br>

                <div>
                    <label for="fecha">Fecha</label><br>
                    <input type="date" id="fecha">
                    <span id="errorFecha"></span>
                </div>

                <br>

                <div>
                    <label for="descripcion">Descripción</label><br>
                    <textarea id="descripcion"></textarea>
                    <span id="errorDescripcion"></span>
                </div>

                <br>

                <div>
                    <label>Marque el punto exacto en el mapa</label>
                    <div id="mapaSeleccion"></div>
                    <span id="errorMapa"></span>

                    <input type="hidden" id="latitud">
                    <input type="hidden" id="longitud">
                </div>

                <br>

                <button type="button" id="btnEnviar" disabled>
                    Publicar Reporte
                </button>


                <div id="mensajeExito"></div>

            </form>

        </fieldset>

           <section class="mapaAlertas">

            <h2>Mapa de Alertas Activas</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4043291.489594278!2d-87.58238367162707!3d8.25023904151963!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f92e56221acc925%3A0x6254f72535819a2b!2sCosta%20Rica!5e0!3m2!1ses-419!2scr!4v1787289446228!5m2!1ses-419!2scr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <div id="mapaAlertas"></div>

        </section>


        <section class="misAlertas">

            <h2>Mis Alertas</h2>

            <div id="contenedorAlertas">

            </div>

        </section>

    </main>
    
    <script src="js/alerta.js"></script>

</body>

</html>
